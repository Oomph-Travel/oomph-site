name: E2E smoke (staging)

# Independent, NON-BLOCKING suite — it is not a required status check, so it
# never gates a deploy or a merge. Targets:
#   - after each develop "Deploy to SiteGround" run  → STAGING (fresh deploy)
#   - nightly on a schedule                          → PRODUCTION (reliable
#     canary; prod has no bot-wall issues from datacenter IPs)
#   - on demand from the Actions tab                 → pick staging/production
#
# Tests never submit a form (see docs/testing.md), so runs create no leads —
# safe against production.

on:
  workflow_run:
    workflows: ["Deploy to SiteGround"]
    types: [completed]
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC nightly
  workflow_dispatch:
    inputs:
      target:
        description: "Site to test"
        type: choice
        options: [staging, production]
        default: staging

# Key the group on trigger + target so a staging run and a production run can
# coexist; only same-kind runs supersede each other.
concurrency:
  group: e2e-${{ github.event_name }}-${{ inputs.target || 'auto' }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ubuntu-latest
    # For workflow_run triggers, only run for a SUCCESSFUL develop deploy.
    # schedule/workflow_dispatch have no workflow_run payload, so allow those.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Pick target site
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "url=https://oomphtravel.com" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "production" ]; then
            echo "url=https://oomphtravel.com" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://staging2.oomphtravel.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: npx playwright test
        env:
          OOMPH_BASE_URL: ${{ steps.target.outputs.url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
