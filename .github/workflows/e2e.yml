name: E2E smoke (staging)

# Independent, NON-BLOCKING suite — it is not a required status check, so it
# never gates a deploy or a merge. It runs against staging:
#   - after each "Deploy to SiteGround" run finishes for the develop branch
#   - nightly on a schedule
#   - on demand from the Actions tab (Run workflow)
#
# Tests never submit a form (see docs/testing.md), so runs create no leads.

on:
  workflow_run:
    workflows: ["Deploy to SiteGround"]
    types: [completed]
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ubuntu-latest
    # For workflow_run triggers, only run for a SUCCESSFUL develop deploy.
    # schedule/workflow_dispatch have no workflow_run payload, so allow those.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.conclusion == 'success')

    env:
      OOMPH_BASE_URL: https://staging2.oomphtravel.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
